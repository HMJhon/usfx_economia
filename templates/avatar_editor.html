{% extends "base.html" %}
{% block title %}Editar avatar 3D{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <h3 class="mb-4">Personalizar avatar 3D · "El Rey"</h3>
    <form method="POST" id="avatar-form">
      <div class="mb-3">
        <label class="form-label">Color primario</label>
        <input type="color" name="color_primary" id="color_primary" class="form-control form-control-color" value="{{ avatar.color_primary }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Color secundario</label>
        <input type="color" name="color_secondary" id="color_secondary" class="form-control form-control-color" value="{{ avatar.color_secondary }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Mensaje al escanear QR</label>
        <input type="text" name="message_scan" id="message_scan" class="form-control" value="{{ avatar.message_scan }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Mensaje al compartir en redes</label>
        <input type="text" name="message_share" class="form-control" value="{{ avatar.message_share }}">
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
  </div>
  <div class="col-md-6 text-center" style="margin-top: 20px;">
    <h5>Vista previa</h5>
    <div style="margin-top: 15px;">
        <img src="/static/avatar.jpeg" alt="Mi Avatar" width="220" style="border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.3);">
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
