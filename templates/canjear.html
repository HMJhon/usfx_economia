{% extends "base.html" %}
{% block title %}Canjear puntos{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="mb-4">Canjear / validar puntos</h3>
    <p class="text-muted">Solo personal administrativo o "El Rey" pueden descontar puntos al momento del canje (ej. fotocopiadora o cafetería).</p>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Usuario del estudiante</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Puntos a descontar</label>
        <input type="number" name="puntos" class="form-control" min="1" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Motivo / descuento aplicado</label>
        <input type="text" name="motivo" class="form-control" placeholder="Ej: Descuento fotocopiadora">
      </div>
      <button type="submit" class="btn btn-primary">Validar canje</button>
    </form>
  </div>
</div>
{% endblock %}
